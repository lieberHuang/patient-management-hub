<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>新建推送计划 | 患者管理中台</title><link rel="stylesheet" href="患者管理中台样式.css"><link rel="stylesheet" href="推送体系.css"><link rel="stylesheet" href="新建推送计划标签多选.css"><script src="侧栏精简.js" defer></script><script src="新建推送计划.js" defer></script></head><body><div class="app"><aside><a class="brand" href="患者管理中台-数据字典原型.html"><i>✚</i>患者管理中台</a><p class="nav-label">患者标签</p><a class="nav" href="患者管理中台-数据字典原型.html">▤ <span>患者主数据</span></a><a class="nav" href="项目患者字典表.html">◫ <span>项目患者字典表</span></a><a class="nav" href="量表关联字典.html">⌁ <span>标签关联关系</span></a><a class="nav tag-nav" href="标签管理.html">♢ <span>标签管理</span></a><a class="nav patient-tag-nav" href="患者标签.html">♧ <span>患者标签</span></a><a class="nav delivery-nav active" href="推送计划.html">✉ <span>推送计划</span></a><div class="user"><b>王</b>王医生 · 管理员</div></aside><main><header><div class="crumb">患者触达 <span>/</span> <a href="推送计划.html">推送计划</a> <span>/</span> <b>新建推送计划</b></div><div class="right">♧ <span>帮助中心</span><b class="avatar">王</b></div></header><div class="content"><div class="title-row"><div><a href="推送计划.html">← 返回推送计划</a><h1 style="margin-top:13px">新建推送计划</h1><p>配置标签匹配人群和企业微信的定时推送节点。</p></div></div><div class="plan-editor"><form class="panel form-panel" id="planForm"><div class="section-head"><div><b>计划配置</b><small>计划名称在所属项目内唯一。</small></div></div><div class="form-grid" style="margin-top:18px"><label>所属项目 <i>*</i><select id="project"><option value="">请选择项目</option><option>慢病管理项目</option><option>肿瘤随访项目</option><option>真实世界研究项目</option></select></label><label>推送计划名称 <i>*</i><input id="planName" placeholder="请输入推送计划名称"></label><label class="full">匹配标签 <i>*</i><div class="tag-multiselect"><button class="tag-multiselect-trigger" id="tagTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="tagMenu" disabled><span class="tag-trigger-text">请选择自定义标签</span><span class="tag-trigger-arrow" aria-hidden="true">⌄</span></button><div class="tag-multiselect-menu" id="tagMenu" role="listbox" aria-multiselectable="true" hidden><p class="tag-empty">请先选择所属项目</p></div></div><p>可选择多个已启用的自定义标签；仅当患者同时满足所选标签时，才会被纳入计划。</p></label><label class="full">人群匹配方式<div class="radio-list"><label><input type="radio" name="match" checked> 满足全部标签</label><label><input type="radio" name="match"> 满足任一标签</label></div></label><label>推送方式<select disabled><option>企业微信</option></select></label><label>规则校验<select id="validation"><option>推送前校验但不移除</option><option>不符合条件即移除</option><option>推送前不校验</option></select></label><label class="full">计划说明<textarea placeholder="可填写此计划的推送目的与说明"></textarea></label></div><div class="section-head" style="margin:22px -20px 0"><div><b>推送节点</b><small>以患者匹配该计划的时间为起点配置推送。</small></div><button class="button ghost small" id="addNode" type="button">＋ 添加节点</button></div><div class="node-list" id="nodeList" style="margin-top:16px"></div><footer style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px"><a class="button ghost" href="推送计划.html">取消</a><button class="button primary" type="submit">保存并启用</button></footer></form><aside class="panel preview-panel"><div class="section-head"><div><b>执行预览</b><small>按当前节点实时展示。</small></div></div><div class="node-list" id="previewList"></div><div class="estimate"><span>预计包括人群<br><small>当前项目总用户数：<b id="projectUsers">—</b></small></span><b id="estimate">—</b></div><p class="rule-tip">推送前将按照“规则校验”再次确认患者是否符合当前标签条件；若计划下架，将停止后续推送和新增匹配。</p></aside></div></div></main></div></body></html>
