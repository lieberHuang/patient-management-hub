<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>患者标签 | 患者管理中台</title><link rel="stylesheet" href="患者管理中台样式.css"><link rel="stylesheet" href="标签管理Tab.css"><link rel="stylesheet" href="患者标签查询.css"><script src="侧栏精简.js" defer></script><script src="患者标签.js" defer></script></head>
<body><div class="app"><aside><a class="brand" href="患者管理中台-数据字典原型.html"><i>✚</i>患者管理中台</a><div class="workspace"><strong>华东临床研究中心</strong>主数据管理工作台⌄</div><p class="nav-label">页面选择</p><a class="nav" href="患者管理中台-数据字典原型.html">▤ <span>患者主数据</span></a><a class="nav" href="项目患者字典表.html">◫ <span>项目患者字典表</span></a><a class="nav" href="量表关联字典.html">⌁ <span>量表关联字典</span></a><a class="nav tag-nav" href="标签管理.html">♢ <span>标签管理</span></a><p class="nav-label space">数据治理</p><a class="nav" href="数据总览.html">▦ <span>数据总览</span></a><p class="nav-label space">系统设置</p><a class="nav">♙ <span>用户与权限</span></a><a class="nav">⚙ <span>操作日志</span></a><div class="user"><b>王</b>王医生 · 管理员</div></aside>
<main><header><div class="crumb">患者标签 <span>/</span> <b>患者标签</b></div><div class="right">♧ <span>帮助中心</span><b class="avatar">王</b></div></header><div class="content"><div class="title-row"><div><h1>患者标签</h1><p>按患者或量表填写记录查看标签的实际生效情况。</p></div></div>
<section class="panel"><div class="patient-filter-grid"><label>患者唯一 ID<input id="patientId" placeholder="请输入患者 ID" autocomplete="off"></label><label>参与项目<select id="project"><option value="all">全部项目</option><option value="慢病管理项目">慢病管理项目</option><option value="肿瘤随访项目">肿瘤随访项目</option><option value="真实世界研究项目">真实世界研究项目</option></select></label><label>量表<select id="scale" disabled><option value="all">全部量表</option></select></label><label>标签<select id="tag" disabled><option value="all">全部标签</option></select></label><label id="tagDateLabel" class="disabled">标签更新时间<span class="date-range"><input id="tagStart" type="date" disabled><i>至</i><input id="tagEnd" type="date" disabled></span></label><label>患者入组时间<span class="date-range"><input id="enrollStart" type="date"><i>至</i><input id="enrollEnd" type="date"></span></label><div class="patient-filter-actions"><button id="query" class="button primary small">查询</button><button id="reset" class="button ghost small">重置</button></div></div></section>
<div class="tag-tabs patient-tabs"><button class="active" data-view="patient">患者维度</button><button data-view="scale">量表维度</button></div>
<section class="panel patient-result" id="patientPanel"><div class="section-head"><div><b>患者列表</b><small id="patientTotal">筛选出 0 位患者</small></div></div><div class="table-wrap"><table id="patientTable"><thead><tr><th>患者 ID</th><th>参与项目</th><th>入组时间</th><th>当前所有标签</th><th>操作</th></tr></thead><tbody></tbody></table></div><p id="patientEmpty" class="empty-state" hidden>暂无符合筛选条件的患者</p></section>
<section class="panel patient-result" id="scalePanel" hidden><div class="section-head"><div><b>量表填写记录</b><small id="recordTotal">筛选出 0 条成功提交记录</small></div></div><div class="table-wrap"><table id="recordTable"><thead><tr><th>填写记录 ID</th><th>患者 ID</th><th>参与项目</th><th>量表名称</th><th>填写时间</th><th>生效标签</th><th>操作</th></tr></thead><tbody></tbody></table></div><p id="recordEmpty" class="empty-state" hidden>暂无符合筛选条件的成功提交记录</p></section>
</div></main></div></body></html>
